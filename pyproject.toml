[project]
name = "agent-browser-decisions"
version = "0.9.4"
description = "Run written browser plans through agent-browser, resolving each step by deterministic label match or a bounded decision model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["browser-automation", "agent-browser", "ai-agents", "decision-models", "system-one", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = ["httpx[http2]>=0.28"]

[project.urls]
Homepage = "https://github.com/akitana-airtanker/agent-browser-decisions"
Repository = "https://github.com/akitana-airtanker/agent-browser-decisions"
Issues = "https://github.com/akitana-airtanker/agent-browser-decisions/issues"

[project.scripts]
agent-browser-decisions = "agent_browser_decisions.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_browser_decisions"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "schema/",
    "examples/",
    "skills/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    ".env.example",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.11",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PLW"]

[tool.pytest.ini_options]
testpaths = ["tests"]

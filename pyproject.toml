[project]
name = "agent-browser-decisions"
version = "0.1.0"
description = "Run written browser plans through agent-browser, resolving each step by label match or a decision model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["httpx[http2]>=0.28"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.11",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
